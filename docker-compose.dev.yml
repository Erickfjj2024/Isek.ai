version: "3.9"
# Uso: docker compose -f docker-compose.dev.yml up
# Modo desenvolvimento: Next.js roda com `npm run dev` (sem build completo)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isek-backend-dev
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  frontend:
    image: node:20-alpine
    container_name: isek-frontend-dev
    working_dir: /app
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules          # anonymous volume para não sobrescrever node_modules do host
    command: sh -c "npm install && npm run dev"
    depends_on:
      backend:
        condition: service_healthy
